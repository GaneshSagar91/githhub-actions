name: Deployments and Environments
on:
  workflow_dispatch:
env:
  NAME: "Ravi"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: echo "Checked out rep code"

      - name: Build application
        run: echo "Building application"

      - name: Environment variables
        run: |
          echo "vars.NAME: ${{ vars.NAME }}"
          echo "env.NAME: ${{ env.NAME }}"
          echo "'$NAME': $NAME"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Environment variables
        run: |
          echo "vars.NAME: ${{ vars.NAME }}"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Environment variables
        run: |
          echo "vars.NAME: ${{ vars.NAME }}"

  unkown-job:
    runs-on: ubuntu-latest
    needs: build
    environment: unknown

    steps:
      - name: Environment variables
        run: |
          echo "vars.NAME: ${{ vars.NAME }}"
